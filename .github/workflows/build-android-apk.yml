name: Build BlockBlitz Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Offline HTML5 + Capacitor APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build offline web bundle and audit zero CDN
        run: |
          npm run build
          npm run audit:offline

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage Debug APK artifact
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/BlockBlitz-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlitz-debug-apk
          path: release-apks/BlockBlitz-debug.apk
          retention-days: 30

      - name: Check optional release signing secrets
        id: signing_check
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          cd android
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk release-apks/BlockBlitz-release.apk

      - name: Clean up temporary keystore
        if: always() && steps.signing_check.outputs.enabled == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload Signed Release APK artifact
        if: steps.signing_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlitz-release-apk
          path: release-apks/BlockBlitz-release.apk
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-apks/*.apk --clobber
          else
            gh release create "$TAG_NAME" release-apks/*.apk \
              --title "BlockBlitz $TAG_NAME" \
              --generate-notes || \
            gh release create "$TAG_NAME" release-apks/*.apk \
              --title "BlockBlitz $TAG_NAME" \
              --notes "Rilis BlockBlitz $TAG_NAME (commit ${GITHUB_SHA::7})."
          fi

      - name: Update rolling 'latest' GitHub Release on main/master
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          NOTES="Build otomatis terbaru dari \`${GITHUB_REF_NAME}\` (commit \`${GITHUB_SHA::7}\`). Unduh \`BlockBlitz-debug.apk\` langsung dan instal di Android."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release-apks/*.apk --clobber
            gh release edit latest --title "BlockBlitz Latest Build" --notes "$NOTES"
          else
            gh release create latest release-apks/*.apk \
              --title "BlockBlitz Latest Build" \
              --notes "$NOTES"
          fi
